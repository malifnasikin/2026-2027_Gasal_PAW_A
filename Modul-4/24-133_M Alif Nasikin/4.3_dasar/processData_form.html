<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Register</title>
<style>
body{font-family:Verdana,sans-serif;font-size:13px;margin:20px}
fieldset{background:rgb(167, 167, 241);width:430px}
.field{margin:6px 0;display:flex}
.field label{width:120px;text-align:right;padding-right:10px}
.err{color:#c00;font-size:12px;margin-left:6px}
.errbox{color:#c00}
</style>
</head>
<body>
<h1>Register</h1>
<fieldset>
 <legend style="font-weight: bold;">Person Details</legend>
<form name="myForm" action="processData.php" method="POST">
  <div class="field">
    <label for="surname">Surname</label>
    <input type="text" id="surname" name="surname" size="31"/>
  </div>
  <div class="field">
    <label for="email">Email address</label>
    <input type="text" id="email" name="email" size="31"/>
  </div>
  <div class="field">
    <label for="passwd">Password</label>
    <input type="password" id="passwd" name="passwd" size="31"/>
  </div>
  <div class="field">
    <label for="address">Street Address</label>
    <textarea id="address" name="address" rows="3" cols="22"></textarea>
  </div>
  <div class="field">
    <label for="state">State</label>
    <select id="state" name="state">
      <option value="-1" selected>[choose your state]</option>
      <option value="1">Australian Capital Territory</option>
      <option value="2">Queensland</option>
      <option value="3">Victoria</option>
      <option value="4">New South Wales</option>
      <option value="5">Tasmania</option>
      <option value="6">South Australia</option>
      <option value="7">Western Australia</option>
      <option value="8">Northern Territory</option>
    </select>
  </div>
  <div class="field">
    <input type="hidden" name="country" value="Australia"/>
  </div>
  <div class="field">
    <label>Gender</label>
    <span><input type="radio" name="sex" value="male"/>Male
    <input type="radio" name="sex" value="female"/>Female</span>
  </div>
  <div class="field">
    <label for="vegetarian">Vegetarian?</label>
    <input type="checkbox" id="vegetarian" name="vegetarian"/>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <span><input type="submit" value="Submit" name="submit"/><input type="reset" value="Reset" name="reset"/></span>
  </div>
</form>
</fieldset>
</body>
</html>
